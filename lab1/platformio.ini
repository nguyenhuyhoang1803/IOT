; ==============================================================================
; PlatformIO Project Configuration - Lab 1 IoT: ESP32 Co Ban
; Framework: Arduino | Chip: ESP32 (esp32dev)
;
; 8 Môi trường biên dịch độc lập:
; - env:bai01       : Đèn giao thông (Green 3s -> Yellow 1s -> Red 3s)
; - env:bai02       : Button điều khiển LED trực tiếp (INPUT_PULLUP)
; - env:bai03       : Toggle switch LED + Debounce bằng millis()
; - env:bai04       : Cảnh báo nhiệt độ DHT22 (>30*C blink LED)
; - env:bai05       : Hiển thị thời gian Uptime trên LCD 16x2 I2C
; - env:homework01  : Trạm thời tiết mini (DHT22 + LCD + Button chuyển F trong 5s + LED độ ẩm)
; - env:homework02  : Stopwatch đếm thời gian MM:SS:ms (2 Button: Start/Pause & Reset)
; - env:homework03  : Menu 3 trang chuyển đổi bằng Button trên LCD 16x2
; ==============================================================================

[platformio]
default_envs = bai01, bai02, bai03, bai04, bai05, homework01, homework02, homework03
src_dir = .

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
    marcoschwartz/LiquidCrystal_I2C @ ^1.1.4

; ------------------------------------------------------------------------------
; Bài 1: Mô phỏng Đèn Giao Thông
; ------------------------------------------------------------------------------
[env:bai01]
build_src_filter = -<*> +<bai01/*.cpp>

; ------------------------------------------------------------------------------
; Bài 2: Button điều khiển LED trực tiếp
; ------------------------------------------------------------------------------
[env:bai02]
build_src_filter = -<*> +<bai02/*.cpp>

; ------------------------------------------------------------------------------
; Bài 3: Công tắc thông minh (Toggle + Debounce millis)
; ------------------------------------------------------------------------------
[env:bai03]
build_src_filter = -<*> +<bai03/*.cpp>

; ------------------------------------------------------------------------------
; Bài 4: Cảnh báo nhiệt độ quá ngưỡng (DHT22 + LED Blink)
; ------------------------------------------------------------------------------
[env:bai04]
build_src_filter = -<*> +<bai04/*.cpp>

; ------------------------------------------------------------------------------
; Bài 5: Uptime trên LCD 16x2 I2C
; ------------------------------------------------------------------------------
[env:bai05]
build_src_filter = -<*> +<bai05/*.cpp>

; ------------------------------------------------------------------------------
; Homework 1: Trạm thời tiết mini / Smart Thermostat
; ------------------------------------------------------------------------------
[env:homework01]
build_src_filter = -<*> +<homework01/*.cpp>

; ------------------------------------------------------------------------------
; Homework 2: Stopwatch MM:SS:ms (Button A & Button B)
; ------------------------------------------------------------------------------
[env:homework02]
build_src_filter = -<*> +<homework02/*.cpp>

; ------------------------------------------------------------------------------
; Homework 3: Simple LCD Menu (3 Pages)
; ------------------------------------------------------------------------------
[env:homework03]
build_src_filter = -<*> +<homework03/*.cpp>
