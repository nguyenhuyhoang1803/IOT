; ==============================================================================
; PlatformIO Project Configuration - Lab 2 IoT: Non-blocking Programming
; Framework: Arduino | Chip: ESP32 (esp32dev)
;
; Ghi chú về Board:
; - Mặc định cấu hình dùng board "esp32dev" (ESP32-WROOM-32 / DevKit V1).
; - Nếu bạn dùng ESP32-S3: thay `board = esp32-s3-devkitc-1`
; - Nếu bạn dùng NodeMCU-32S: thay `board = nodemcu-32s`
;
; Cách chọn bài để Build/Upload:
; - Trên giao diện VS Code, click vào nút Environment switcher ở thanh Status Bar
;   (ví dụ: "env:bai01") và chọn bài muốn chạy (bai01 -> bai08).
; - Hoặc chạy lệnh qua terminal: pio run -e bai01 (thay bai01 bằng bài tương ứng)
; ==============================================================================

[platformio]
default_envs = bai01
src_dir = .

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; Thư viện Adafruit DHT cho các bài có cảm biến nhiệt độ - độ ẩm
lib_deps =
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; ------------------------------------------------------------------------------
; Bài 1: Hai LED nhấp nháy độc lập (500 ms & 1200 ms)
; ------------------------------------------------------------------------------
[env:bai01]
build_src_filter = -<*> +<bai01/*.cpp>

; ------------------------------------------------------------------------------
; Bài 2: Button debounce bằng millis() điều khiển 2 LED
; ------------------------------------------------------------------------------
[env:bai02]
build_src_filter = -<*> +<bai02/*.cpp>

; ------------------------------------------------------------------------------
; Bài 3: Heartbeat LED (1s) + Serial uptime định kỳ (3s)
; ------------------------------------------------------------------------------
[env:bai03]
build_src_filter = -<*> +<bai03/*.cpp>

; ------------------------------------------------------------------------------
; Bài 4: Đọc DHT11 không chặn (2s) + Button phản hồi tức thì
; ------------------------------------------------------------------------------
[env:bai04]
build_src_filter = -<*> +<bai04/*.cpp>

; ------------------------------------------------------------------------------
; Bài 5: Ba tác vụ song song (LED 300ms, Button toggle LED, Loop counter/s)
; ------------------------------------------------------------------------------
[env:bai05]
build_src_filter = -<*> +<bai05/*.cpp>

; ------------------------------------------------------------------------------
; Bài 6: Đèn giao thông FSM (Đỏ 5s -> Xanh 4s -> Vàng 2s)
; ------------------------------------------------------------------------------
[env:bai06]
build_src_filter = -<*> +<bai06/*.cpp>

; ------------------------------------------------------------------------------
; Bài 7: Đọc DHT11 (2s) + Buzzer cảnh báo nhấp nháy non-blocking (200ms)
; ------------------------------------------------------------------------------
[env:bai07]
build_src_filter = -<*> +<bai07/*.cpp>

; ------------------------------------------------------------------------------
; Bài 8: LEDC Hardware PWM 5 mức độ sáng + Heartbeat + Button debounce
; ------------------------------------------------------------------------------
[env:bai08]
build_src_filter = -<*> +<bai08/*.cpp>

